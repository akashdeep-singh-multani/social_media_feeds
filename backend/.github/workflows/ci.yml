name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: --health-cmd="mongo --eval 'db.adminCommand(\"ping\")'" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          npm install

      # Run backend tests
      - name: Run backend tests
        working-directory: ./backend
        run: |
          npm test

      # Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm install

      # Run frontend tests
      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          npm test

      # Deployment to Vercel is handled by Vercel GitHub integration
      # Vercel automatically deploys from the main branch, so no manual deployment script is required
      # If you want to add a custom deployment step (e.g., Vercel CLI), you can include that here, but Vercel does most of it automatically.
      - name: Vercel Deployment (Optional - if you want to trigger a deploy from CLI)
        if: success()
        run: |
          echo "Vercel deployment triggered automatically after successful tests"
