<form
  [formGroup]="commentsForm"
  (ngSubmit)="onSubmit()"
  aria-labelledby="Comments form heading"
>
  <input
    matInput
    formControlName="comment"
    placeholder="Add a comment"
    aria-label="Enter a comment"
  />
  <button
    class="feature_buttons"
    mat-raised-button
    color="primary"
    type="submit"
    [disabled]="!commentsForm.valid"
    aria-label="Post a comment"
  >
    Post a comment
  </button>
</form>
